<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เงินยืมเพื่อกิจกรรมของหน่วยงาน CULAC v20</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b6fa8;--navy2:#2299d5;--pink:#ea6aa7;--pinkd:#9c2d66;--ink:#111826;--ink2:#101a28;--line:#cfd8e3;--bg:#f3f6fa;--card:#fff;--green:#15803d;--amber:#b45309;--red:#b91c1c;--sb:#123d63}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
::placeholder{color:#1b4f7a;opacity:1;font-style:italic}
#app{display:flex;min-height:100vh}
/* sidebar */
#sb{width:250px;flex:none;background:var(--sb);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
#sb .brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px 16px 12px;border-bottom:1px solid rgba(255,255,255,.15)}
#sb .brand img{height:34px;background:#fff;border-radius:8px;padding:4px 8px}
#sb .brand b{font-size:15px;line-height:1.2;display:block}#sb .brand small{font-size:12px;color:#cfe4f5}
#sb .me{padding:10px 16px;font-size:13.5px;color:#e6f0f8;border-bottom:1px solid rgba(255,255,255,.15)}#sb .me b{display:block;color:#fff;font-size:15px}
#sb nav{padding:8px 0;flex:1}#sb nav h6{margin:14px 12px 4px;padding:5px 8px;font-size:12.5px;color:#fff;background:rgba(255,255,255,.12);border-radius:6px;font-weight:700}
#sb nav button .st{flex:none;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--sb);font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
#sb nav button .ok{margin-left:auto;color:#8ff0b0;font-weight:800}
#sb nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#e6f0f8;padding:10px 16px;cursor:pointer;font-size:15px;border-left:4px solid transparent}
#sb nav button:hover{background:rgba(255,255,255,.08)}#sb nav button.on{background:rgba(255,255,255,.14);border-left-color:var(--pink);color:#fff;font-weight:700}
#sb nav button .n{margin-left:auto;background:var(--pink);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px}
#sb .foot{padding:12px 16px;font-size:12.5px;color:#cfe4f5;border-top:1px solid rgba(255,255,255,.15)}#sb .foot button{background:none;border:1px solid #9fc3e0;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
/* main */
#main{flex:1;min-width:0}
#top{display:none;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#top button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}#top b{font-size:15px}
#page{max-width:980px;margin:0 auto;padding:22px 24px 60px}
h1.pg{font-size:24px;margin:0 0 4px;color:var(--navy)}p.sub{margin:0 0 16px;color:var(--ink2);font-size:14.5px}
h3.sec{font-size:15px;margin:22px 0 8px;color:var(--pinkd);text-transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer}.tile .l{font-size:13.5px;color:var(--ink2)}.tile .v{font-size:26px;font-weight:800;color:var(--navy)}.tile.hot{border-color:var(--pink);background:#fff5fa}.tile.bad{border-color:var(--red);background:#fff1f1}.tile.bad .v{color:var(--red)}
.big{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;cursor:pointer;text-align:left}.big.pri{border-color:var(--navy);background:#eef6fc}.big .ic{font-size:30px}.big b{display:block;font-size:17px}.big small{color:var(--ink2);font-size:13.5px}.big:disabled{border-style:dashed;border-color:#101a28;background:#fff;cursor:not-allowed}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:15px}.btn.b1{background:var(--navy);color:#fff}.btn.b2{background:var(--green);color:#fff}.btn.bo{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}.btn.br{background:#fff;border:1.5px solid var(--red);color:var(--red)}.btn.bs{padding:7px 12px;font-size:13.5px}.btn.full{width:100%;display:block}.btn:disabled{background:#fff!important;color:#101a28!important;border:1.5px dashed #101a28!important;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
label.f{display:block;margin-bottom:12px}label.f span{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}input:focus,select:focus,textarea:focus{outline:2px solid var(--navy2);border-color:var(--navy2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.money{font-size:22px;font-weight:800;color:var(--navy);text-align:right;font-variant-numeric:tabular-nums}
.err{color:var(--red);font-weight:600;min-height:20px;margin:6px 0}
.note{border-radius:10px;padding:10px 14px;margin:8px 0;font-size:14.5px;border:1px solid}.n-b{background:#eef6fc;border-color:#9fc3e0;color:#0d3b63}.n-g{background:#edf9f0;border-color:#9fd5ad;color:#0f5132}.n-a{background:#fff8e6;border-color:#f3cf7a;color:#6b4300}.n-r{background:#fff1f1;border-color:#f3a2a2;color:#7f1d1d}.n-o{background:#fff5fa;border-color:#f2b4d0;color:#7a1f4d}
.it{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}.it .t{font-weight:700}.it .s{font-size:13.5px;color:var(--ink2)}.it .a{margin-left:auto;font-weight:800;color:var(--navy);white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700}.p-b{background:#dcebf8;color:#0d3b63}.p-g{background:#d7f1df;color:#0f5132}.p-a{background:#fdebc2;color:#6b4300}.p-r{background:#fbd5d5;color:#7f1d1d}.p-p{background:#fbdce9;color:#7a1f4d}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:15px;margin:0}.kv dt{color:var(--ink2);font-weight:600}.kv dd{margin:0}
.track{display:flex;gap:6px;margin:10px 0 4px}.track div{flex:1;text-align:center;font-size:12.5px;padding:6px 4px;border-radius:8px;background:#fff;border:1px solid var(--ink2);color:var(--ink2)}.track .d{background:#d7f1df;color:#0f5132}.track .c{background:var(--navy);color:#fff;font-weight:700}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eef1f5;font-size:14.5px;cursor:pointer}.ck input{width:20px;height:20px;margin-top:2px;flex:none}
.choice{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer}.choice.on{border-color:var(--navy);background:#eef6fc}.choice b{display:block}.choice small{color:var(--ink2);font-size:13px}.two{display:flex;gap:10px;margin-bottom:12px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--navy2);border-radius:14px;padding:18px;background:#fff;cursor:pointer;text-align:center}.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.ph{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}.ph img{width:100%;height:100%;object-fit:cover}.ph button{position:absolute;top:2px;right:2px;border:0;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer}
.att{background:#fff;border:1px solid var(--navy);color:var(--navy);border-radius:8px;padding:4px 10px;font-size:13.5px;cursor:pointer;margin:2px 4px 2px 0}
.eq{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.eq>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.eq .l{font-size:12.5px;color:var(--ink2)}.eq .v{font-size:19px;font-weight:800;color:var(--navy);text-align:right}.eq>.ok{border-color:var(--green);background:#edf9f0}.eq>.bad{border-color:var(--red);background:#fff1f1}
.tw{overflow:auto}table.t{width:100%;border-collapse:collapse;font-size:14px;background:#fff}table.t th,table.t td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}table.t th{background:#eef3f8}table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.seg button{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.who{font-size:13px;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;z-index:50;pointer-events:none}#toast.on{opacity:1;transform:translateX(-50%)}#toast.bad{background:var(--red)}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--pink);transform:scaleX(0);transform-origin:left;transition:.3s;z-index:60}#bar.on{transform:scaleX(.7)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}.md{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px}.md img{max-width:100%}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eef6fc,#fff5fa)}
#login .box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:420px}
#login img{height:64px;display:block;margin:0 auto 10px}#login h2{text-align:center;margin:0 0 2px;color:var(--navy);font-size:20px}#login p.c{text-align:center;color:var(--ink2);margin:0 0 18px;font-size:14px}
#pa{display:none}
@media(max-width:900px){#sb{position:fixed;left:-260px;z-index:30;transition:.2s;height:100vh}#sb.open{left:0}#top{display:flex}#page{padding:14px 14px 70px}.g3{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}#shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29}#shade.on{display:block}}
@media print{@page{size:A4;margin:12mm 14mm}html,body{background:#fff}#app,#login,#toast,#bar,#shade{display:none!important}#pa{display:block;color:#000;font-size:13px}
 .pa h1{font-size:19px;text-align:center;margin:0 0 4px;color:#1b6fa8}.pa table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px}.pa th,.pa td{border:1px solid #9fb8cc;padding:5px 8px;vertical-align:top}.pa th{background:#1b6fa8;color:#fff;font-weight:800}.pa tr:nth-child(even) td{background:#f4f8fc}.pa .hd{border-bottom:3px solid #ea6aa7;padding-bottom:6px}.pa .n{text-align:right}.pa .bx{border:1px solid #000;padding:6px 10px;margin:8px 0}.pa .sig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:24px;page-break-inside:avoid}.pa .sig div{text-align:center}.pa .sig i{display:block;border-top:1px solid #000;width:85%;margin:30px auto 4px}.pa .ft{margin-top:8px;font-size:11px;display:flex;justify-content:space-between}.pa h4{margin:10px 0 4px;font-size:14px}.pa td.d,.pa th.d{white-space:nowrap}.pa .hd{text-align:center;margin-bottom:6px}.pa .hd img{height:40px}}
</style></head><body><div id="bar"></div><div id="toast"></div>
<div id="login" style="display:none"></div>
<div id="app" style="display:none"><div id="shade"></div><aside id="sb"></aside><div id="main"><div id="top"><button data-act="menu">☰</button><b id="topT"></b><span id="sync" class="who" style="margin-left:auto"></span></div><div id="page"></div></div></div>
<div id="pa"></div>

function rInt(s,h){s=String(s).replace(/^0+/,'');if(!s)return '';if(s.length>6)return rInt(s.slice(0,-6))+'ล้าน'+rInt(s.slice(-6),true);let r='',L=s.length;
  for(let i=0;i<L;i++){const d=+s[i],p=L-i-1;if(!d)continue;if(p===1&&d===1)r+='สิบ';else if(p===1&&d===2)r+='ยี่สิบ';else if(p===0&&d===1&&(L>1||h))r+='เอ็ด';else r+=TD[d]+TP[p]}return r}

  let h=0;for(const c of txt)h=(h*31+c.charCodeAt(0))>>>0;return 'x'+h.toString(16)}

/* ---- storage: local / Google Apps Script ---- */
const online=()=>!!DEV.api;
async function api(p){const r=await fetch(DEV.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},p,{key:DEV.key}))});
  const j=await r.json();if(!j.ok)throw E(j.error||'เซิร์ฟเวอร์ตอบกลับผิดพลาด');return j}
async function pull(force){if(!online())return;if(!force&&Date.now()-LASTPULL<15000)return;busy(true);
  try{const j=await api({action:'get'});if(j.state){S=normalize(j.state)}VER=j.ver;LASTPULL=Date.now();saveLocal();setSync()}catch(e){setSync(e.message)}finally{busy(false)}}
async function commit(mut){
  if(!online()){const d=clone(S);const res=mut(d);S=d;saveLocal();return res}
  busy(true);try{for(let i=0;i<4;i++){const j=await api({action:'get'});const d=normalize(j.state||clone(S));const res=mut(d);
      const p=await api({action:'put',ver:j.ver,state:d});if(p.conflict)continue;S=d;VER=p.ver;LASTPULL=Date.now();saveLocal();setSync();return res}
    throw E('มีผู้ใช้บันทึกพร้อมกัน กรุณาลองใหม่อีกครั้ง')}finally{busy(false)}}
async function run(mut,msg,after){try{const r=await commit(mut);if(ME)ME=userOf(ME.email)||ME;if(msg)toast(typeof msg==='function'?msg(r):msg);if(after)after(r);render();return r}catch(e){alert(e.message);render()}}
function setSync(err){const el=$('#sync');if(!el)return;if(!online()){el.textContent='';return}el.textContent=err?'⚠ ออฟไลน์':'⟳ '+new Date(LASTPULL).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}

/* ---- attachments ---- */
const IDB={db:null,open(){return new Promise((ok,no)=>{if(this.db)return ok(this.db);const q=indexedDB.open('culac_loan_files',1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>{this.db=q.result;ok(this.db)};q.onerror=()=>no(q.error)})},
  async put(r){const db=await this.open();return new Promise((ok,no)=>{const t=db.transaction('files','readwrite');t.objectStore('files').put(r);t.oncomplete=ok;t.onerror=()=>no(t.error)})},
  async get(id){const db=await this.open();return new Promise((ok,no)=>{const q=db.transaction('files').objectStore('files').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}};
const readURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
function shrink(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{let w=im.width,h=im.height,m=1600;if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.75))};im.onerror=no;im.src=u})}
async function storeFiles(files){const out=[];busy(true);try{for(const f of files){
  if(f.size>10*1024*1024)throw E('ไฟล์ '+f.name+' ใหญ่เกิน 10 MB');
  const img=f.type.startsWith('image/');const data=img?await shrink(f):await readURL(f);const type=img?'image/jpeg':f.type;
  if(online()){const j=await api({action:'upload',name:f.name,type,data});out.push({id:j.id,src:'gas',name:f.name})}
  else{const id=uid('F');await IDB.put({id,name:f.name,type,data});out.push({id,src:'idb',name:f.name})}}}finally{busy(false)}return out}
async function viewFile(src,id){try{busy(true);let f;if(src==='gas')f=await api({action:'file',id});else f=await IDB.get(id);busy(false);
  if(!f)return alert('ไม่พบไฟล์แนบในเครื่องนี้');
  modal('ไฟล์แนบ',f.type.startsWith('image/')?`<img src="${f.data}">`:`<p>ไฟล์ ${esc(f.name)}</p><a class="btn b1" download="${esc(f.name)}" href="${f.data}">เปิด/ดาวน์โหลดไฟล์</a>`)}catch(e){busy(false);alert(e.message)}}

  if(!(a>0)||!d||!due||!no)return alert('กรอกเลขที่สัญญา จำนวนเงิน วันที่ยืม และกำหนดส่งใช้');if(due<=d)return alert('กำหนดส่งใช้ต้องหลังวันที่ยืม');if(!confirm(`บันทึกรับเงินยืม ${fmt(a)} บาท (${label}) กำหนดส่งใช้ ${thD(due)}?`))return;
  await run(s=>{if(openLoan(s))throw E('ยังมีรอบที่เปิดอยู่');if(Math.abs(cashOf(s))+Math.abs(bankOf(s))>0.005)throw E('ยังมีเงินค้างจากรอบก่อน');const l={id:uid('L'),no,label,date:d,due,amount:a,receivedTo:to,status:'open',by:ME.name};s.loans.push(l);
    (to==='bank'?addBank:addCash)(s,d,'รับเงินยืม',no,`${ME.name} รับเงินยืมเพื่อกิจกรรมของหน่วยงาน (${label})`,a,0);log(s,'รับเงินยืม '+fmt(a)+' กำหนดส่งใช้ '+thD(due),no)},'บันทึกแล้ว',()=>{NAV={scr:'home'};HIST=[]})}
async function doSettle(id){if([...document.querySelectorAll('.sk')].some(c=>!c.checked))return alert('ตรวจและทำเครื่องหมายให้ครบ');const m=$('#stM').value,d=$('#stD').value||today(),ref=$('#stRef').value.trim();if(!confirm('ยืนยันส่งใช้และปิดรอบ? หลังปิดรอบจะเบิกไม่ได้จนกว่าจะบันทึกรับเงินยืมรอบใหม่'))return;
  await run(s=>{const l=s.loans.find(z=>z.id===id);if(!l||l.status!=='open')throw E('รอบนี้ปิดแล้ว');if(outs(s).length)throw E('ยังมีเงินค้างกับผู้เบิก');if(d>today())throw E('วันที่ต้องไม่เป็นอนาคต');
    const pv=pendV(s),spent=pvOf(s),c=cashOf(s),b=bankOf(s),back=r2(c+b);if(Math.abs(r2(spent+back)-l.amount)>=0.005)throw E('ยอดบิล + เงินคืน ไม่เท่ายอดยืม');
    if(c>0)addCash(s,d,'คืนเงินยืม (ส่งใช้)',l.no,'ส่งใช้ '+l.label,0,c);if(b>0)addBank(s,d,'คืนเงินยืม (ส่งใช้)',l.no,'ส่งใช้ '+l.label,0,b);pv.forEach(v=>{v.status='settled';v.loanId=l.id});
    Object.assign(l,{status:'closed',closedDate:d,spent,returned:back,returnMethod:m,ref,voucherIds:pv.map(v=>v.id),closedBy:ME.name});log(s,`ส่งใช้เงินยืม บิล ${fmt(spent)} คืน ${fmt(back)}`,l.no)},'ส่งใช้และปิดรอบแล้ว',()=>{NAV={scr:'loan'};HIST=[]})}

async function gPush(){if(!online())return alert('ยังไม่ได้เชื่อมต่อ');if(!confirm('ข้อมูลบนเซิร์ฟเวอร์จะถูกแทนที่ด้วยข้อมูลในเครื่องนี้ ยืนยัน?'))return;try{busy(true);const j=await api({action:'get'});const p=await api({action:'put',ver:j.ver,state:S});VER=p.ver;busy(false);toast('ส่งแล้ว')}catch(e){busy(false);alert(e.message)}}
function csvOf(k){let h=[],rows=[];if(k==='cash'||k==='bank'){h=['วันที่','รายการ','อ้างอิง','รายละเอียด','รับ','จ่าย','ผู้บันทึก'];rows=(k==='cash'?S.cashbook:S.bankbook).map(c=>[c.date,c.type,c.ref,c.desc,c.in,c.out,c.by])}
  if(k==='bills'){h=['เลขที่','วันที่','ร้านค้า','รายการ','เลขที่บิล','หลักฐาน','ฝ่าย','โครงการ','ใบเบิก','GL','จำนวนเงิน','สถานะ'];rows=S.vouchers.map(v=>[v.no,v.date,v.payee,v.desc,v.billNo,EV[v.evType]||'',v.division,v.project,v.reqNo,v.gl,v.amount,v.status==='pending'?'รอส่งใช้':'ส่งใช้แล้ว'])}
  if(k==='ledger'){h=['วันที่','รายการ','รายละเอียด','อ้างอิง','รับเข้า','จ่ายออก','คงเหลือ'];rows=ledgerWithBal().map(c=>[c.date,c.type,c.desc,c.ref,c.in,c.out,c.bal])}
  if(k==='debtors'){h=['เลขที่','ผู้เบิก','ฝ่าย','เบิกเพื่อ','วันรับเงิน','จำนวนเงิน','กำหนดส่ง','เกิน(วัน)'];rows=outs().map(r=>[r.no,r.requester,r.division,r.activity,r.paidDate,r.paidAmount,due(r),Math.max(0,od(r))])}
  if(k==='reqrpt'){h=['เลขที่','วันที่ยื่น','ผู้เบิก','ฝ่าย','ประเภท','เบิกเพื่อ','โครงการ','จำนวนเงิน','จ่ายเมื่อ','วิธี','โอนเข้าบัญชี','ใช้จริง','คืน','จ่ายเพิ่ม','ปิดเมื่อ','สถานะ'];rows=S.requests.filter(r=>r.status!=='cancelled').map(r=>[r.no,r.createdAt.slice(0,10),r.requester,r.division,TYPE[r.type],r.activity,r.project,r.amount,r.paidDate||'',r.paidDate?(r.payMethod==='transfer'?'โอน':'เงินสด'):'',acctText(r.payTo),r.close?r.close.actual:'',r.close?r.close.returned:'',r.close?r.close.extra:'',r.close?r.close.date:'',STATUS[r.status][0]])}
  if(k==='users'){h=['ชื่อ','อีเมล','ฝ่าย','ธนาคาร','เลขที่บัญชี','ชื่อบัญชี','บทบาท'];rows=S.users.map(u=>[u.name,u.email,u.division,(u.bank||{}).bankName,(u.bank||{}).accNo,(u.bank||{}).accName,u.role==='holder'?'ผู้ยืม/ผู้จ่ายเงิน':'ผู้เบิก'])}
  if(k==='payees'){h=['หน่วยงาน/ร้านค้า','ธนาคาร','เลขที่บัญชี','ชื่อบัญชี'];rows=S.payees.map(p=>[p.org,p.bankName,p.accNo,p.accName])}
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const txt='﻿'+[h,...rows].map(r=>r.map(q).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download=`culac-loan-v12-${k}-${today()}.csv`;a.click()}
/* ================= v12: หน้าหลักแยกบทบาท · ทะเบียนเงินยืม · รายงาน · อัปโหลด GL ================= */
const ledgerRows=()=>[...S.cashbook.map(c=>Object.assign({m:'cash'},c)),...S.bankbook.map(c=>Object.assign({m:'bank'},c))].filter(c=>c.in||c.out).sort((a,b)=>(a.date+a.at).localeCompare(b.date+b.at));
function ledgerWithBal(){let bal=0;return ledgerRows().map(c=>{bal=r2(bal+c.in-c.out);return Object.assign({bal},c)})}
const qStat=()=>{const l=openLoan();const spent=pvOf(),ot=otOf(),c=cashOf(),b=bankOf();return {l,spent,ot,bal:r2(c+b),cash:c,bank:b,left:l?dd(today(),l.due):null,used:l&&l.amount?Math.round((spent+ot)/l.amount*100):0}};

function reportBody(k,print){const q=qStat();const tbl=(h,rows,foot)=>`<table class="${print?'':'t'}" style="width:100%"><tr>${h.map(c=>`<th class="${c[1]?'n':''}${c[2]?' d':''}">${c[0]}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${h[i][1]?'n':''}${h[i][2]?' d':''}">${h[i][1]?(v===''?'':fmt(v)):esc(v)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">ไม่มีรายการ</td></tr>`}${foot||''}</table>`;

    case 'gopay':go('payone',id);break;case 'pay':el.disabled=true;await doPay(id);break;case 'gorecv':C=null;go('recvone',id);break;case 'radd':C.lines=readLines('r');C.lines.push({desc:'',amount:'',billNo:'',billDate:today(),vendor:''});render();break;case 'rrm':C.lines=readLines('r');C.lines.splice(+id,1);render();break;case 'recv':el.disabled=true;await doRecv(id);break;
    case 'print':printReq(id);break;case 'stprint':printSettle(id);break;case 'settle':await doSettle(id);break;case 'loannew':await loanNew();break;
    case 'bt':BT=id;render();break;case 'bkmove':await bkMove();document.querySelectorAll('.ov').forEach(o=>o.remove());break;case 'bkmv':bkMoveModal();break;case 'rp':RP=id;render();break;case 'glreset':if(confirm('คืนรายการ GL มาตรฐาน '+GL_EMBED.length+' รายการ?'))await run(s=>{s.settings.glList=GL_EMBED.slice()},'คืนค่าแล้ว');break;case 'rpt':printReport(id);break;case 'csv':csvOf(id);break;
    case 'uadd':await uAdd();break;case 'useed':{const pw=await hashPw('1234');await run(s=>{let n=0;for(const p of STAFF_EMBED){if(userOf(p.email,s))continue;s.users.push({email:p.email,name:p.name,position:p.position,division:p.division,role:'staff',admin:false,pw,createdAt:now(),bank:null});n++}log(s,'นำเข้ารายชื่อที่ฝัง '+n+' คน','');return n},n=>'นำเข้าแล้ว '+n+' คน');break}case 'ubulk':await uBulk();break;case 'hset':await hSet();break;case 'ureset':case 'udel':case 'uholder':case 'ubank':case 'ubanksave':await uAct(a,id);break;case 'acctsave':await acctSave();break;case 'setsave':await setSave();break;case 'gsave':await gSave();break;case 'gpush':await gPush();break;case 'pwsave':await pwSave();break;
    case 'bkdl':{const a2=document.createElement('a');a2.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a2.download=`culac-loan-v12-backup-${today()}.json`;a2.click();break}}});
document.addEventListener('input',e=>{const c=e.target.classList;if(!c)return;if(c.contains('wA')&&W){W.lines=readLines('w');const t=$('#wTot');if(t)t.textContent=fmt(sumL(W.lines))}if(c.contains('cA')&&C&&$('#cTot'))cUpd();if(c.contains('rA')&&C&&$('#rAct'))rUpd()});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='bkUp'&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!j.users)throw 0;if(!confirm('แทนที่ข้อมูลในเครื่องด้วยไฟล์สำรอง?'))return;S=normalize(j);saveLocal();ME=userOf(ME.email);render();toast('นำเข้าแล้ว')}catch(x){alert('ไฟล์ไม่ถูกต้อง')}}
  if(t.id==='wPaySel'){wRead();const p=S.payees[+t.value];W.payee=p?Object.assign({},p):{org:'',bankName:'',accNo:'',accName:''};render()}
  if(t.classList.contains('udiv')){const em=t.dataset.id,dv=t.value;await run(s=>{const u=userOf(em,s);if(u)u.division=dv})}
  if(t.classList.contains('vgl')){const id=t.dataset.id,v=t.value;await run(s=>{const x=s.vouchers.find(z=>z.id===id);if(x)x.gl=v})}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lPw')doLogin()});
$('#shade').addEventListener('click',()=>{$('#sb').classList.remove('open');$('#shade').classList.remove('on')});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME)pull().then(()=>{ME=userOf(ME.email)||ME;render()})});
(async function boot(){await pull(true);if(!S.users.length){const n=await seedStaff(S);S.log.push({t:now(),user:'ระบบ',action:'นำเข้ารายชื่อบุคลากรที่ฝังในระบบ '+n+' คน',ref:''});saveLocal();if(online()){try{const j=await api({action:'get'});if(!(j.state&&j.state.users&&j.state.users.length)){const p=await api({action:'put',ver:j.ver,state:S});VER=p.ver}}catch(e){}}}if(DEV.me){const u=userOf(DEV.me);if(u&&sessionStorage.getItem('culac_loan_sess')===u.email)ME=u}render()})();
</script></body></html>
